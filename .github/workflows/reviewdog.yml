name: reviewdog
on: [pull_request]
jobs:
  checkstyle:
    name: Checkstyle
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: dbelyaev/action-checkstyle@master
        with:
          github_token: ${{ secrets.github_token }}
          reporter: github-pr-review
          checkstyle_config: ./dev-environment/themis_checks.xml